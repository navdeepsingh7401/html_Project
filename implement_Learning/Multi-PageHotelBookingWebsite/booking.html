<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking | ABC Hotel</title>
</head>
<body>
    <header>
        <p><a href="index.html">ABC Hotel</a></p>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html" aria-current="page">Booking</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h1>Request a booking</h1>
        <p>Send us your preferred dates and room details. The hotel will contact you to confirm availability.</p>
        <form action="#" method="get">
            <fieldset>
                <legend>Your details</legend>
                <p>
                    <label for="guest-name">Full name</label>
                    <input type="text" id="guest-name" name="guest-name" autocomplete="name" required>
                </p>
                <p>
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </p>
                <p>
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" required>
                </p>
            </fieldset>
            <fieldset>
                <legend>Your stay</legend>
                <p>
                    <label for="check-in">Check-in date</label>
                    <input type="date" id="check-in" name="check-in" required>
                </p>
                <p>
                    <label for="check-out">Check-out date</label>
                    <input type="date" id="check-out" name="check-out" required>
                </p>
                <p>
                    <label for="guests">Number of guests</label>
                    <input type="number" id="guests" name="guests" min="1" max="4" value="1" required>
                </p>
                <p>
                    <label for="room-type">Room type</label>
                    <select id="room-type" name="room-type" required>
                        <option value="">Choose a room</option>
                        <option value="standard">Standard Room</option>
                        <option value="mountain-view">Mountain View Room</option>
                        <option value="family-suite">Family Suite</option>
                    </select>
                </p>
                <p>Bed preference</p>
                <label><input type="radio" name="bed-preference" value="king"> King bed</label>
                <label><input type="radio" name="bed-preference" value="twin"> Twin beds</label>
                <p>Additional requests</p>
                <label><input type="checkbox" name="requests" value="accessible"> Accessible room</label>
                <label><input type="checkbox" name="requests" value="breakfast"> Include breakfast</label>
                <p>
                    <label for="notes">Additional notes</label>
                    <textarea id="notes" name="notes" rows="5" cols="40"></textarea>
                </p>
            </fieldset>
            <p>
                <button type="submit">Send booking request</button>
                <button type="reset">Reset form</button>
            </p>
        </form>
    </main>
    <footer>
        <p>&copy; <time datetime="2026">2026</time> ABC Hotel</p>
        <p><a href="contact.html">Questions? Contact us</a></p>
    </footer>
</body>
</html>
