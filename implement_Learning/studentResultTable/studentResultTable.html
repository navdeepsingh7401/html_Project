<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Table Reference</title>
    <style>
        table {
    border-collapse: collapse;
    width: 700px;
    margin: 20px auto;
}

caption {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
}

th,
td {
    border: 1px solid black;
    padding: 10px;
    text-align: center;
}

th[scope="col"] {
    background-color: #333;
    color: white;
}

th[scope="row"] {
    background-color: #ddd;
}

tbody tr:nth-child(even) {
    background-color: #f2f2f2;
}

tbody tr:hover {
    background-color: #ddd;
}

td:last-child {
    font-weight: bold;
}

tfoot {
    font-weight: bold;
}

tfoot td {
    background-color: #eee;
}
    </style>
</head>

<body>

    <table border="1">

        <caption>Student Result Report</caption>

        <thead>

                <th>Student Name</th>
                <th>HTML</th>

        </thead>

            </tr>

            <tr>

    </table>

</body>

</html>
