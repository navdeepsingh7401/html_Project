<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Links</title>
</head>
<body>
    <h1>HTML Links</h1>

    <p>Use the <strong>&lt;a&gt;</strong> tag to create links.</p>

    <a href="https://www.example.com">Visit Example.com</a>

    <p><a href="#about">Jump to About section</a></p>

    <h2 id="about">About</h2>
    <p>This is the About section of the page.</p>

    <p><a href="mailto:hello@example.com">Send an email</a></p>
</body>
</html>
