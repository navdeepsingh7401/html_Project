<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Attributes</title>
</head>
<body>
    <h1>HTML Attributes</h1>

    <p title="This is a tooltip">Move your mouse over this sentence to see the title attribute.</p>

    <p id="intro">This paragraph has an id attribute.</p>

    <p class="note">This paragraph has a class attribute.</p>
    <p class="note">This is another paragraph with the same class.</p>

    <a href="https://www.google.com" target="_blank">Visit Google</a>

    <img src="https://via.placeholder.com/300x150" alt="Sample image" width="300" height="150">

    <p lang="en">This paragraph uses a language attribute.</p>
</body>
</html>
