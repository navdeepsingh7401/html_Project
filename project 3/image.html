<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Images</title>
</head>
<body>
    <h1>HTML Images</h1>

    <p>HTML uses the <strong>&lt;img&gt;</strong> tag to display images.</p>

    <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape" width="500" height="300">

    <p>The image above has an alt text description so people can understand it if the image does not load.</p>

    <img src="https://via.placeholder.com/250" alt="Placeholder image" width="250" height="150">
</body>
</html>
