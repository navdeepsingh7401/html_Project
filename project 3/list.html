<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>
<body>
    <h1>HTML Lists</h1>

    <h2>Unordered List</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Open your browser</li>
        <li>Write the HTML code</li>
        <li>Save the file and open it</li>
    </ol>

    <h2>Nested List</h2>
    <ul>
        <li>Frontend</li>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
        </ul>
        <li>Backend</li>
        <ul>
            <li>Node.js</li>
            <li>Python</li>
        </ul>
    </ul>
</body>
</html>
