<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe</title>
</head>
<body>
    <h1>iframe</h1>

    <p>The <strong>&lt;iframe&gt;</strong> tag embeds another web page inside the current page.</p>

    <iframe src="https://example.com" width="600" height="300" title="Example website"></iframe>

    <pre>
&lt;iframe src="https://example.com" width="600" height="300" title="Example website"&gt;&lt;/iframe&gt;
    </pre>

    <h2>When to use iframe?</h2>
    <ul>
        <li>Embed a video</li>
        <li>Show a map</li>
        <li>Display a third-party web page</li>
    </ul>

    <h2>Example with a local page</h2>
    <iframe src="Forms.html" width="100%" height="400" title="Forms page example"></iframe>
</body>
</html>
